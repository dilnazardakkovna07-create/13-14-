<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        header {
            background: #4CAF50;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 28px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #4CAF50;
        }
        p {
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
        }
        .btn:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

<header>
    Django Home Page
</header>

<div class="container">
    <h2>Қош келдіңіз!</h2>
    <p>
        Бұл — сіздің Django жобаңыздың бастапқы беті.  
        Мұнда сайттың негізгі ақпаратын, навигациясын және басқа беттерге сілтемелерді орналастыра аласыз.
    </p>

    <a href="/admin/" class="btn">Admin панелге кіру</a>
</div>

</body>
</html>
